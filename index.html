<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignLens AI Pro - Smart Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0a0e1a;
            --accent1: #00f0ff;
            --accent2: #7c3aed;
            --accent3: #ff006e;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .bg-cyber {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(124, 58, 237, 0.05) 0%, transparent 60%),
                var(--primary);
            z-index: 0;
            pointer-events: none;
        }
        .app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px 20px;
            gap: 10px;
            max-width: 1440px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 18px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            flex-shrink: 0;
        }
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: #888;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        .cam-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #131b2e;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.05);
        }
        .cam-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: conic-gradient(from 0deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderRotate 4s linear infinite;
            z-index: 2;
            pointer-events: none;
        }
        @keyframes borderRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .cam-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }
        .cam-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
            z-index: 1;
        }
        .cam-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 5px 14px;
            border: none;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.05);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }
        .btn-success {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        .btn-success:hover {
            background: rgba(0, 255, 136, 0.25);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: rgba(255, 0, 110, 0.15);
            color: #ff006e;
            border: 1px solid rgba(255, 0, 110, 0.2);
        }
        .btn-danger:hover {
            background: rgba(255, 0, 110, 0.25);
            transform: translateY(-2px);
        }
        .fps-display {
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: #666;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .fps-display span {
            color: var(--accent1);
        }

        .results-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .result-card {
            flex: 1;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            gap: 4px;
        }
        .letter-display {
            font-family: 'Orbitron', monospace;
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff 30%, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .gesture-name {
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            min-height: 20px;
        }

        .confidence-section {
            width: 100%;
            max-width: 250px;
            margin-top: 4px;
        }
        .confidence-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .confidence-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
            border-radius: 10px;
            transition: width 0.25s ease;
        }

        .action-row {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 280px;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-row .btn {
            font-size: 0.6rem;
            padding: 4px 12px;
        }

        /* Word Builder */
        .word-builder {
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 16px;
            flex-shrink: 0;
        }
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .word-header span {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .word-display {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            min-height: 40px;
            text-align: center;
            letter-spacing: 4px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 4px 12px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .word-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .word-actions .btn {
            font-size: 0.55rem;
            padding: 3px 10px;
        }

        /* Gesture Memory */
        .memory-section {
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 16px;
            flex-shrink: 0;
            max-height: 100px;
            overflow-y: auto;
        }
        .memory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .memory-header span {
            font-size: 0.55rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .memory-items {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .memory-tag {
            font-size: 0.6rem;
            padding: 2px 10px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 12px;
            color: var(--accent1);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .memory-tag .delete {
            cursor: pointer;
            color: #ff006e;
            font-weight: 700;
            font-size: 0.7rem;
        }
        .memory-tag .delete:hover {
            transform: scale(1.3);
        }

        .bottom-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }
        .log-section {
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 8px 14px;
            overflow: hidden;
        }
        .log-label {
            font-size: 0.55rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .log-messages {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            flex-wrap: nowrap;
            padding: 2px 0;
        }
        .log-message {
            font-size: 0.6rem;
            color: #888;
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            animation: slideIn 0.3s ease;
            flex-shrink: 0;
        }
        @keyframes slideIn {
            0% {
                transform: translateX(-10px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1a1f2e;
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }
        .modal h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .modal input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            margin: 8px 0;
            font-family: 'Inter', sans-serif;
        }
        .modal input:focus {
            outline: none;
            border-color: var(--accent1);
        }
        .modal .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .modal .btn-row .btn {
            flex: 1;
            padding: 8px;
            font-size: 0.7rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .letter-display {
                font-size: 80px;
                min-height: 80px;
            }
            .result-card {
                min-height: 150px;
            }
            .bottom-bar {
                grid-template-columns: 1fr;
            }
            .app {
                padding: 10px 14px;
                gap: 8px;
            }
            .memory-section {
                max-height: 60px;
            }
        }
        @media (max-width: 600px) {
            .letter-display {
                font-size: 60px;
                min-height: 60px;
            }
            .cam-controls {
                bottom: 8px;
                padding: 4px 10px;
                gap: 4px;
                width: 95%;
            }
            .btn {
                font-size: 0.55rem;
                padding: 3px 8px;
            }
            .word-display {
                font-size: 1.2rem;
                min-height: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-cyber"></div>

    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">✦ SIGNLENS <span style="font-size:0.6rem;color:#666;font-family:'Inter',sans-serif;">LEARN</span></div>
            <div class="status">
                <span class="status-dot"></span>
                <span id="ai-status">Ready</span>
                <span style="margin-left:6px;color:#444;">|</span>
                <span id="fps-display" style="font-family:'Orbitron',monospace;font-size:0.6rem;">0 FPS</span>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Camera -->
            <div class="cam-wrapper">
                <video id="webcam" playsinline autoplay muted></video>
                <canvas id="hand-canvas"></canvas>
                <div class="cam-controls">
                    <button id="start-cam" class="btn btn-primary">▶ Start</button>
                    <button id="toggle-tts" class="btn btn-secondary">🔊 TTS</button>
                    <button id="btn-add-gesture" class="btn btn-success">➕ Learn</button>
                    <button id="btn-clear-word" class="btn btn-secondary">✖ Clear</button>
                </div>
            </div>

            <!-- Results -->
            <div class="results-panel">
                <div class="result-card">
                    <div class="letter-display" id="letter-display">—</div>
                    <div class="gesture-name" id="gesture-name">Awaiting Gesture</div>
                    <div class="confidence-section">
                        <div class="confidence-label">
                            <span>Confidence</span>
                            <span id="conf-percent">0%</span>
                        </div>
                        <div class="confidence-track">
                            <div class="confidence-fill" id="confidence-fill"></div>
                        </div>
                    </div>
                    <div class="action-row">
                        <button id="btn-add-to-word" class="btn btn-success">➕ Add to Word</button>
                        <button id="btn-correct" class="btn btn-secondary">✏️ Correct</button>
                    </div>
                </div>

                <!-- Word Builder -->
                <div class="word-builder">
                    <div class="word-header">
                        <span>📝 Word Builder</span>
                        <span id="word-count">0 letters</span>
                    </div>
                    <div class="word-display" id="word-display">—</div>
                    <div class="word-actions">
                        <button id="btn-speak-word" class="btn btn-secondary">🔊 Speak</button>
                        <button id="btn-clear-word" class="btn btn-danger">Clear</button>
                        <button id="btn-undo-word" class="btn btn-secondary">↩ Undo</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <!-- Gesture Memory -->
            <div class="memory-section">
                <div class="memory-header">
                    <span>🧠 Gesture Memory</span>
                    <span id="memory-count">0 gestures</span>
                </div>
                <div class="memory-items" id="memory-items">
                    <span style="font-size:0.6rem;color:#444;">No gestures learned yet</span>
                </div>
            </div>

            <!-- Log -->
            <div class="log-section">
                <div class="log-label">📋 Activity Log</div>
                <div class="log-messages" id="log-messages">
                    <span class="log-message">Ready to learn!</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Gesture -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>✋ Learn New Gesture</h2>
            <p style="color:#888;font-size:0.8rem;margin-bottom:8px;">Current gesture detected: <strong id="modal-current-letter">—</strong></p>
            <input type="text" id="modal-letter-input" placeholder="Enter letter (e.g., A, B, C...)" maxlength="1" />
            <input type="text" id="modal-name-input" placeholder="Gesture name (e.g., 'Peace Sign')" />
            <div class="btn-row">
                <button id="modal-save" class="btn btn-success">💾 Save</button>
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
